# Snip — Windows 11 Snipping Tool for Noctalia + Hyprland.
#
# One keybind (`noctalia msg plugin bebra/snip:service all open`) opens a flat top-center
# menu. Screenshots are taken by Noctalia's own screenshot commands and open in its
# annotation editor. The [[service]] owns all state and runs scripts/snip.sh; the panels
# are thin clients that talk to it through the "command" state channel.

id = "bebra/snip"
name = "Snip"
version = "0.2.0"
plugin_api = 30
author = "bebra"
license = "MIT"
icon = "screenshot"
description = "Windows 11 style snipping: flat action bar, window highlight, screenshots via Noctalia, recording."
tags = ["screenshot", "recording", "hyprland", "service", "panel"]
dependencies = ["grim", "slurp", "imagemagick", "jq", "hyprpicker", "tesseract", "zbar", "gpu-screen-recorder", "wl-clipboard"]

[[setting]]
key = "video_dir"
type = "folder"
label_key = "settings.video_dir.label"
default = "~/Videos/Screencasts"

[[setting]]
key = "fps"
type = "int"
label_key = "settings.fps.label"
default = 60
min = 15
max = 240

[[setting]]
key = "codec"
type = "select"
label_key = "settings.codec.label"
default = "h264"
options = [
  { value = "h264", label_key = "settings.codec.h264" },
  { value = "hevc", label_key = "settings.codec.hevc" },
  { value = "av1", label_key = "settings.codec.av1" },
]

[[setting]]
key = "ocr_lang"
type = "string"
label_key = "settings.ocr_lang.label"
description_key = "settings.ocr_lang.description"
default = "eng+rus"

[[service]]
id = "service"
entry = "service.luau"

# The flat action bar. Opened only by the service.
[[panel]]
id = "menu"
entry = "menu.luau"
width = 920
height = 84
placement = "floating"
position = "top_center"
layer = "overlay"
keyboard_focus = "exclusive"
capture_keys = ["1", "2", "3", "4", "5", "6", "7", "Tab", "Return", "KP_Enter"]

# Recording indicator: countdown, timer and stop. Never takes focus, survives other panels.
[[panel]]
id = "recbar"
entry = "recbar.luau"
width = 230
height = 52
placement = "floating"
position = "top_center"
layer = "overlay"
persistent = true
keyboard_focus = "none"
dismiss_on_outside_click = false
